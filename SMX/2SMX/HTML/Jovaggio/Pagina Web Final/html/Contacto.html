  <h2 class="Contacto" >Contacto</h2>
  <h2>Formulario de Contacto</h2>
  <form id="contactForm">
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se aceptan letras" placeholder="Pepe" required>
    </div>
    <div class="form-group">
      <label for="apellido">Apellidos:</label>
      <input type="text" id="apellido" name="apellido" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se aceptan letras" placeholder="Fuentes Alcañiz" required>
    </div>
    <div class="form-group">
      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" title="El número de teléfono debe tener 9 dígitos" placeholder="656982586" required>
    </div>
    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" placeholder="Pepefuealc@hotmail.com" required>
    </div>
    <div class="form-group">
      <label for="Mensajes">Mensaje:</label>
      <input class="mensajess" type="text" id="Mensajes" name="Mensajes" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" title="Solo se aceptan letras" placeholder="Escribeme" required>
    </div>
    
    <button class="submit">Enviar</button>
  </form>
 
</section>
