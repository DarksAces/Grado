# Simple Apache Configuration Simulator

ServerRoot "."
Listen 80
Listen 443

ErrorLog "logs/error.log"
CustomLog "logs/access.log"

# Default fallback
DocumentRoot "www/default"

<VirtualHost *:80>
    ServerName site1.local
    DocumentRoot "www/site1"
</VirtualHost>

<VirtualHost *:80>
    ServerName site2.local
    DocumentRoot "www/site2"
</VirtualHost>
