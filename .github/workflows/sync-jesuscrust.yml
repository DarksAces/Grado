name: Sync JesusCrust
on:
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:  # Ejecución manual

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Clonar TU repo (DarksAces/Grado)
      - name: Checkout my repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 2️⃣ Clonar el repo original en una carpeta temporal
      - name: Clone original repo
        run: |
          git clone https://github.com/ericmorrou/JesusCrust.git temp_original
      
      # 3️⃣ Copiar archivos del original a tu repo (excluyendo .git y temp_original)
      - name: Sync files
        run: |
          rsync -a --delete --exclude='.git' --exclude='temp_original' temp_original/ ./
          rm -rf temp_original
      
      # 4️⃣ Commit y push SOLO si hay cambios
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Sync from ericmorrou/JesusCrust"
            git push
          fi  
