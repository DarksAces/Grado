name: JesusCrust

on:
  schedule:
    - cron: '0 * * * *'  # Ejecutar cada hora
  workflow_dispatch:     # Permite ejecución manual

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio original
        uses: actions/checkout@v3
        with:
          repository: ericmorrou/JesusCrust
          path: original

      - name: Clonar tu repositorio
        uses: actions/checkout@v3
        with:
          path: myrepo

      - name: Sincronizar archivos
        run: |
          rsync -a --delete original/ myrepo/

      - name: Commit y Push de los cambios
        run: |
          cd myrepo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Sincronización con el repositorio original"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
