name: Sync JesusCrust

on:
  schedule:
    # Ejecuta cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    # Clonar repo original público
    - name: Checkout original repo
      uses: actions/checkout@v3
      with:
        repository: ericmorrou/JesusCrust
        path: original

    # Clonar tu repo (para push)
    - name: Checkout my repo
      uses: actions/checkout@v3
      with:
        path: myrepo
        token: ${{ secrets.GITHUB_TOKEN }}

    # Sincronizar cambios
    - name: Sync changes
      run: |
        rsync -a --delete original/ myrepo/

    # Commit y push si hay cambios
    - name: Commit and push
      run: |
        cd myrepo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff-index --quiet HEAD || git commit -m "Sync from original repo"
        git push
