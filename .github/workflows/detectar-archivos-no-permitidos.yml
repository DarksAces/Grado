name: Detectar archivos o carpetas no permitidos

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  detectar-y-limpiar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Buscar y eliminar archivos/carpetas prohibidas
        id: eliminar
        run: |
          set -e
          CHANGED=false

          # Buscar SOLO archivos con extensiones prohibidas (case insensitive, word boundary)
          FILES=$(git ls-files | grep -iE '\.(pdf|zip|exe|rar|7z|tar|mp4|mov)$' || true)
          
          if [ -n "$FILES" ]; then
            echo "=== Encontrados archivos prohibidos ==="
            echo "$FILES"
            echo "======================================"
            
            # Eliminar archivos uno por uno para manejar espacios correctamente
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                # Verificar que realmente tenga una extensión prohibida
                if [[ "$file" =~ \.(pdf|zip|exe|rar|7z|tar|mp4|mov|PDF|ZIP|EXE|RAR|7Z|TAR|MP4|MOV)$ ]]; then
                  echo "✗ Eliminando: $file"
                  git rm -f "$file"
                  CHANGED=true
                fi
              fi
            done <<< "$FILES"
          fi

          # Eliminar carpetas prohibidas
          CARPETAS=(".vs" ".idea" "node_modules" "venv" "__pycache__")
          for carpeta in "${CARPETAS[@]}"; do
            # Buscar archivos dentro de estas carpetas
            DIRS=$(git ls-files | grep -iE "(^|/)${carpeta}/" || true)
            if [ -n "$DIRS" ]; then
              echo "=== Encontrada carpeta prohibida: ${carpeta} ==="
              
              # Obtener solo las carpetas únicas
              UNIQUE_DIRS=$(echo "$DIRS" | sed 's|/.*||' | sort -u)
              
              while IFS= read -r dir; do
                if [ -n "$dir" ] && [ -d "$dir" ]; then
                  echo "✗ Eliminando carpeta: $dir"
                  git rm -rf "$dir" || true
                  CHANGED=true
                fi
              done <<< "$UNIQUE_DIRS"
            fi
          done

          # Buscar en el directorio de trabajo (archivos no trackeados)
          for ext in pdf zip exe rar 7z tar mp4 mov PDF ZIP EXE RAR 7Z TAR MP4 MOV; do
            while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                echo "✗ Eliminando archivo no trackeado: $file"
                rm -f "$file"
                CHANGED=true
              fi
            done < <(find . -type f -name "*.${ext}" -not -path "./.git/*" -print0 2>/dev/null || true)
          done

          for carpeta in "${CARPETAS[@]}"; do
            while IFS= read -r -d '' dir; do
              if [ -d "$dir" ]; then
                echo "✗ Eliminando carpeta no trackeada: $dir"
                rm -rf "$dir"
                CHANGED=true
              fi
            done < <(find . -type d -name "${carpeta}" -not -path "./.git/*" -print0 2>/dev/null || true)
          done

          if [ "$CHANGED" = true ]; then
            echo "✓ Se detectaron y eliminaron archivos/carpetas prohibidos"
          else
            echo "✓ No se encontraron archivos/carpetas prohibidos"
          fi

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Crear Pull Request automático
        if: steps.eliminar.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🗑️ Eliminar archivos o carpetas no permitidos detectados automáticamente"
          branch: cleanup-${{ github.run_id }}
          delete-branch: true
          base: main
          title: "🚨 Eliminar archivos o carpetas no permitidos"
          body: |
            🚨 Se detectaron y eliminaron archivos o carpetas no permitidos en el repositorio.
            
            **Tipos de archivos eliminados:**
            - 📄 PDFs, ZIPs, EXEs, RARs, 7z, TAR
            - 🎥 MP4, MOV
            - 📁 Carpetas: .vs, .idea, node_modules, venv, __pycache__
            
            ⚠️ **IMPORTANTE:** Archivos `.java`, `.md`, y otros archivos de código NO fueron eliminados.
            
            ⚠️ **Por favor, revisa los cambios antes de hacer merge.**
            
            ---
            _Este PR fue creado automáticamente por GitHub Actions._
          labels: |
            automated
            cleanup