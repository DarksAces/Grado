name: Detectar archivos o carpetas no permitidos

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  detectar-y-limpiar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Crear rama temporal
        id: crear_rama
        run: |
          BRANCH="cleanup-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH

      - name: Buscar y eliminar archivos/carpetas prohibidas
        id: eliminar
        run: |
          set -e
          CHANGED=false

          # Lista de extensiones prohibidas
          EXTENSIONES=("*.pdf" "*.zip" "*.exe" "*.rar" "*.7z" "*.tar" "*.mp4" "*.mov")
          
          # Buscar archivos prohibidos en el índice de Git
          for ext in "${EXTENSIONES[@]}"; do
            # Buscar archivos con esta extensión (case insensitive)
            FILES=$(git ls-files | grep -iE "\.(pdf|zip|exe|rar|7z|tar|mp4|mov)$" || true)
            if [ -n "$FILES" ]; then
              echo "Encontrados archivos prohibidos:"
              echo "$FILES"
              echo "$FILES" | xargs -r git rm -f
              CHANGED=true
            fi
          done

          # Eliminar carpetas prohibidas
          CARPETAS=(".vs" ".idea" "node_modules" "venv" "__pycache__")
          for carpeta in "${CARPETAS[@]}"; do
            DIRS=$(git ls-files | grep -iE "(^|/)${carpeta}/" | cut -d'/' -f1-2 | sort -u || true)
            if [ -n "$DIRS" ]; then
              echo "Encontradas carpetas prohibidas:"
              echo "$DIRS"
              echo "$DIRS" | xargs -r git rm -rf
              CHANGED=true
            fi
          done

          # También buscar en el directorio de trabajo (archivos no trackeados)
          for ext in pdf zip exe rar 7z tar mp4 mov; do
            while IFS= read -r -d '' file; do
              if [ -f "$file" ]; then
                echo "Eliminando archivo no trackeado: $file"
                rm -f "$file"
                CHANGED=true
              fi
            done < <(find . -type f -iname "*.${ext}" -print0 2>/dev/null || true)
          done

          for carpeta in "${CARPETAS[@]}"; do
            while IFS= read -r -d '' dir; do
              if [ -d "$dir" ]; then
                echo "Eliminando carpeta no trackeada: $dir"
                rm -rf "$dir"
                CHANGED=true
              fi
            done < <(find . -type d -iname "${carpeta}" -print0 2>/dev/null || true)
          done

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit y push
        if: steps.eliminar.outputs.changed == 'true'
        run: |
          git commit -m "Eliminar archivos o carpetas no permitidos detectados automáticamente"
          git push origin ${{ steps.crear_rama.outputs.branch }}

      - name: Crear Pull Request automático
        if: steps.eliminar.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.crear_rama.outputs.branch }}
          base: main
          title: "🚨 Eliminar archivos o carpetas no permitidos"
          body: |
            🚨 Se detectaron archivos o carpetas no permitidos en el repositorio y se eliminaron automáticamente.
            
            Por favor, revisa los cambios antes de hacer merge.