name: Detectar archivos o carpetas no permitidos

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  detectar-y-limpiar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Crear rama temporal
        id: crear_rama
        run: |
          BRANCH="cleanup-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH

      - name: Buscar y eliminar archivos/carpetas prohibidas
        id: eliminar
        run: |
          set -e

          CHANGED=false

          # Eliminar archivos prohibidos
          while IFS= read -r -d '' file; do
            git rm -f "$file"
            CHANGED=true
          done < <(find . -type f \( -iname "*.pdf" -o -iname "*.zip" -o -iname "*.exe" -o -iname "*.rar" -o -iname "*.7z" -o -iname "*.tar" -o -iname "*.mp4" -o -iname "*.mov" \) -print0)

          # Eliminar carpetas prohibidas
          while IFS= read -r -d '' dir; do
            git rm -rf "$dir"
            CHANGED=true
          done < <(find . -type d \( -iname ".vs" -o -iname ".idea" -o -iname "node_modules" -o -iname "venv" -o -iname "__pycache__" \) -print0)

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit y push o borrar rama temporal
        run: |
          if [ "${{ steps.eliminar.outputs.changed }}" == "true" ]; then
            echo "Se detectaron archivos/carpetas prohibidas. Haciendo commit y push..."
            git commit -m "Eliminar archivos o carpetas no permitidos detectados automáticamente"
            git push origin ${{ steps.crear_rama.outputs.branch }}
          else
            echo "No se detectaron archivos/carpetas prohibidas. Borrando rama temporal..."
            git checkout main
            git branch -D ${{ steps.crear_rama.outputs.branch }}
          fi
        shell: bash

      - name: Crear Pull Request automático
        if: steps.eliminar.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.crear_rama.outputs.branch }}
          base: main
          title: "Eliminar archivos o carpetas no permitidos"
          body: |
            🚨 Se detectaron archivos o carpetas no permitidos en el repositorio y se eliminan automáticamente.
