name: Detectar archivos o carpetas no permitidos

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  detectar-y-limpiar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Crear rama temporal
        id: crear_rama
        run: |
          BRANCH="cleanup-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b $BRANCH

      - name: Eliminar archivos y carpetas prohibidas
        id: eliminar
        run: |
          set -e

          # Archivos prohibidos
          FILES=$(find . -type f \( -iname "*.pdf" -o -iname "*.zip" -o -iname "*.exe" -o -iname "*.rar" -o -iname "*.7z" -o -iname "*.tar" -o -iname "*.mp4" -o -iname "*.mov" \) -print0)

          # Carpetas prohibidas
          DIRS=$(find . -type d \( -iname ".vs" -o -iname ".idea" -o -iname "node_modules" -o -iname "venv" -o -iname "__pycache__" \) -print0)

          CHANGED=false

          # Eliminar archivos
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs -0 git rm -f -- || true
            CHANGED=true
          fi

          # Eliminar carpetas
          if [ -n "$DIRS" ]; then
            echo "$DIRS" | xargs -0 git rm -rf -- || true
            CHANGED=true
          fi

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Commit y Push si hay cambios
        run: |
          if [ "${{ steps.eliminar.outputs.changed }}" == "true" ]; then
            git commit -m "Eliminar archivos o carpetas no permitidos detectados automáticamente"
            git push origin ${{ steps.crear_rama.outputs.branch }}
          else
            echo "No hay cambios, eliminando rama temporal."
            git checkout main
            git branch -D ${{ steps.crear_rama.outputs.branch }}
        shell: bash

      - name: Crear Pull Request automático
        if: steps.eliminar.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.crear_rama.outputs.branch }}
          base: main
          title: "Eliminar archivos o carpetas no permitidos"
          body: |
            🚨 Se detectaron archivos o carpetas no permitidos en el repositorio y se eliminan automáticamente.

